<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a237e">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <title>EduCenter OS</title>
  <style>
    :root {
      --primary: #1a237e; --primary-2: #303f9f; --accent: #ff6f00;
      --bg: #f4f6fb; --card: #ffffff; --text: #1c2333; --muted: #6b7280;
      --green: #16a34a; --red: #dc2626; --amber: #d97706; --border: #e5e7eb;
      --radius: 14px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html[dir="rtl"] body { font-family: 'Segoe UI', 'Tahoma', system-ui, sans-serif; }
    html[dir="ltr"] body { font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; }

    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2)); position: relative; }
    .login-card { background: var(--card); border-radius: 20px; padding: 36px 30px; width: 100%; max-width: 400px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
    .login-card h1 { font-size: 22px; margin-bottom: 4px; color: var(--primary); }
    .login-card p { color: var(--muted); font-size: 13px; margin-bottom: 22px; }
    .demo-hint { margin-top: 18px; font-size: 12px; color: var(--muted); background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; line-height: 1.7; }

    label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
    input, select, textarea { width: 100%; padding: 11px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 15px; background: #fff; color: var(--text); }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 20px; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600; cursor: pointer; background: var(--primary); color: #fff; transition: .15s; }
    .btn:hover { background: var(--primary-2); }
    .btn.full { width: 100%; margin-top: 18px; }
    .btn.accent { background: var(--accent); } .btn.accent:hover { filter: brightness(1.08); }
    .btn.ghost { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
    .btn.danger { background: var(--red); }
    .btn.sm { padding: 7px 12px; font-size: 13px; }

    .app { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: var(--primary); color: #fff; padding: 20px 0; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .sidebar .logo { padding: 0 22px 18px; font-size: 18px; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,.15); margin-bottom: 10px; }
    .sidebar .logo small { display: block; font-size: 11px; font-weight: 400; opacity: .7; margin-top: 3px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 11px 22px; color: rgba(255,255,255,.8); cursor: pointer; font-size: 14px; text-decoration: none; border-inline-start: 3px solid transparent; }
    .nav-item:hover { background: rgba(255,255,255,.08); color: #fff; }
    .nav-item.active { background: rgba(255,255,255,.12); color: #fff; border-inline-start-color: var(--accent); font-weight: 700; }
    .sidebar .spacer { flex: 1; }
    .sidebar .whoami { padding: 14px 22px; font-size: 12px; opacity: .85; border-top: 1px solid rgba(255,255,255,.15); }
    .sidebar .whoami .out { background: rgba(255,255,255,.12); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 12px; margin-top: 8px; width: 100%; }
    .main { flex: 1; padding: 26px 30px; max-width: 1200px; }

    .topbar { display: none; }
    @media (max-width: 860px) {
      .app { flex-direction: column; }
      .sidebar { position: fixed; bottom: 0; top: auto; width: 100%; height: auto; flex-direction: row; padding: 0; z-index: 50; overflow-x: auto; }
      .sidebar .logo, .sidebar .spacer, .sidebar .whoami { display: none; }
      .nav-item { flex-direction: column; gap: 3px; padding: 9px 12px; font-size: 10.5px; border: none; min-width: 72px; align-items: center; }
      .nav-item .icon { font-size: 20px; }
      .main { padding: 16px 14px 90px; }
      .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--primary); color: #fff; position: sticky; top: 0; z-index: 40; }
      .topbar .t-logo { font-weight: 800; font-size: 16px; }
      .topbar button { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }
    }

    h2.page-title { font-size: 20px; margin-bottom: 18px; }
    h3.section-title { font-size: 15px; margin: 22px 0 10px; color: var(--muted); }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
    .card { background: var(--card); border-radius: var(--radius); padding: 18px; border: 1px solid var(--border); }
    .kpi { display: flex; flex-direction: column; gap: 4px; }
    .kpi .v { font-size: 26px; font-weight: 800; color: var(--primary); }
    .kpi .l { font-size: 12.5px; color: var(--muted); }
    .kpi.warn .v { color: var(--red); }
    .kpi.ok .v { color: var(--green); }

    .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th { text-align: start; padding: 11px 14px; background: #f8fafc; color: var(--muted); font-size: 12px; white-space: nowrap; border-bottom: 1px solid var(--border); }
    td { padding: 11px 14px; border-bottom: 1px solid #f1f5f9; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }

    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
    .badge.green { background: #dcfce7; color: var(--green); }
    .badge.red { background: #fee2e2; color: var(--red); }
    .badge.amber { background: #fef3c7; color: var(--amber); }
    .badge.blue { background: #dbeafe; color: #1d4ed8; }
    .badge.gray { background: #f1f5f9; color: var(--muted); }

    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
    .toolbar input, .toolbar select { width: auto; min-width: 150px; }
    .toolbar .grow { flex: 1; }

    .att-btns { display: flex; gap: 6px; }
    .att-btn { width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid var(--border); background: #fff; cursor: pointer; font-size: 15px; }
    .att-btn.sel-present { background: var(--green); color: #fff; border-color: var(--green); }
    .att-btn.sel-absent { background: var(--red); color: #fff; border-color: var(--red); }
    .att-btn.sel-late { background: var(--amber); color: #fff; border-color: var(--amber); }
    .att-btn.sel-excused { background: #6366f1; color: #fff; border-color: #6366f1; }

    .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; }
    .quiz-q { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
    .quiz-q .q-text { font-weight: 600; margin-bottom: 10px; }
    .opt { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1.5px solid var(--border); border-radius: 10px; margin-bottom: 7px; cursor: pointer; }
    .opt:hover { border-color: var(--primary); }
    .list-item { display: flex; justify-content: space-between; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 13px 16px; margin-bottom: 9px; flex-wrap: wrap; gap: 8px; }
    .child-tab { display: inline-block; padding: 8px 18px; border-radius: 999px; border: 1.5px solid var(--border); background: #fff; cursor: pointer; font-size: 13.5px; font-weight: 600; margin-inline-end: 8px; margin-bottom: 8px; }
    .child-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .lang-switch { position: absolute; top: 14px; inset-inline-end: 16px; background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.4); color: #fff; padding: 5px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; }
    .qr-box { text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="/app.js"></script>
</body>
</html>
